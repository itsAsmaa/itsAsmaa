<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Chip robot mascot waving" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .body   { fill:#161b22; stroke:#58a6ff; stroke-width:3; }
    .pin    { stroke:#58a6ff; stroke-width:3; stroke-linecap:round; }
    .eye    { fill:#58a6ff; }
    .glow   { fill:#58a6ff; }
    .trace  { stroke:#30363d; stroke-width:2; fill:none; }
    .mouth  { stroke:#58a6ff; stroke-width:3; fill:none; stroke-linecap:round; }

    .arm     { transform-origin: 62px 118px; animation: wave 1.6s ease-in-out infinite; }
    .blinker { animation: blink 4s steps(1) infinite; }
    .float   { animation: float 3.2s ease-in-out infinite; }
    .pulse   { animation: pulse 1.6s ease-in-out infinite; }

    @keyframes wave  { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-22deg)} 60%{transform:rotate(14deg)} }
    @keyframes blink { 0%,92%{opacity:1} 94%,97%{opacity:0.05} 99%,100%{opacity:1} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  </style>

  <g class="float">
    <!-- antenna -->
    <line class="pin" x1="120" y1="46" x2="120" y2="28"/>
    <circle class="glow pulse" cx="120" cy="24" r="6"/>

    <!-- side pins -->
    <g class="pin">
      <line x1="68" y1="78"  x2="52" y2="78"/>
      <line x1="68" y1="100" x2="52" y2="100"/>
      <line x1="68" y1="122" x2="52" y2="122"/>
      <line x1="172" y1="78"  x2="188" y2="78"/>
      <line x1="172" y1="100" x2="188" y2="100"/>
      <line x1="172" y1="122" x2="188" y2="122"/>
      <line x1="96"  y1="152" x2="96"  y2="168"/>
      <line x1="120" y1="152" x2="120" y2="168"/>
      <line x1="144" y1="152" x2="144" y2="168"/>
    </g>

    <!-- chip body -->
    <rect class="body" x="68" y="46" width="104" height="106" rx="16"/>

    <!-- circuit traces -->
    <path class="trace" d="M80 140 h14 v-12 h16"/>
    <path class="trace" d="M160 60 h-14 v10 h-12"/>

    <!-- face -->
    <g class="blinker">
      <rect class="eye" x="92"  y="82" width="12" height="18" rx="5"/>
      <rect class="eye" x="136" y="82" width="12" height="18" rx="5"/>
    </g>
    <path class="mouth" d="M104 118 q16 14 32 0"/>

    <!-- waving arm -->
    <g class="arm">
      <line class="pin" x1="62" y1="118" x2="40" y2="96"/>
      <circle class="glow" cx="36" cy="90" r="7"/>
    </g>
  </g>
</svg>
